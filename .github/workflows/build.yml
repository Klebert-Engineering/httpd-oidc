name: Build

# Builds and smoke-tests the image. Publishing happens only from a GitHub
# release, see release.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          tags: httpd-oidc:ci

      - name: Smoke test
        run: test/smoke.sh httpd-oidc:ci
