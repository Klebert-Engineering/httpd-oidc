name: Release

# Publishes the image when a GitHub release is published. The release tag
# v<httpd version>-<build number> (e.g. v2.4.71-1) becomes the image tag
# 2.4.71-1, which is never overwritten. `latest` moves to the newest
# non-prerelease release.
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/klebert-engineering/httpd-oidc
  TAG: ${{ github.event.release.tag_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check release tag
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([1-9][0-9]*)$ ]]; then
            echo "::error::Release tag '$TAG' does not match v<httpd version>-<build number>, e.g. v2.4.71-1"
            exit 1
          fi
          httpd="${BASH_REMATCH[1]}"
          pinned="$(sed -n 's/^FROM httpd:\([0-9][0-9.]*\).*/\1/p' Dockerfile)"
          if [[ "$httpd" != "$pinned" ]]; then
            echo "::error::Release tag '$TAG' names httpd $httpd, but the Dockerfile at this tag uses httpd $pinned"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if out="$(docker manifest inspect "$IMAGE:$VERSION" 2>&1)"; then
            echo "::error::$IMAGE:$VERSION already exists. Published versions are never overwritten; create the next build number instead."
            exit 1
          fi
          if ! grep -q -i -E 'manifest unknown|not found' <<<"$out"; then
            echo "::error::Could not check whether $IMAGE:$VERSION exists: $out"
            exit 1
          fi
          echo "$IMAGE:$VERSION does not exist yet"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          no-cache: true
          load: true
          tags: httpd-oidc:release

      - name: Smoke test
        run: test/smoke.sh httpd-oidc:release

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Add the image to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh release view "$TAG" --json body -q .body > notes.md
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          printf '\n\n**Image:** `%s:%s`\n**Digest:** `%s`\n' "$IMAGE" "$VERSION" "$DIGEST" >> notes.md
          gh release edit "$TAG" --notes-file notes.md
