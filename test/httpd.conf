# Minimal config used by CI to check that the image starts with mod_auth_openidc.
# Mirrors the README example; the OIDC values are placeholders.
ServerName localhost
Listen 8099

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule unixd_module modules/mod_unixd.so

LoadModule auth_openidc_module /usr/lib/apache2/modules/mod_auth_openidc.so

ErrorLog /proc/self/fd/2

OIDCProviderMetadataURL https://idp.example.com/realms/test/.well-known/openid-configuration
OIDCClientID test-client
OIDCClientSecret test-secret
OIDCRedirectURI http://localhost:8099/redirect_uri
OIDCCryptoPassphrase test-passphrase
OIDCScope "openid email profile"

ProxyPreserveHost On
ProxyRequests Off
ProxyPass / http://backend:8089/
ProxyPassReverse / http://backend:8089/

<Location />
    AuthType openid-connect
    Require valid-user
</Location>
